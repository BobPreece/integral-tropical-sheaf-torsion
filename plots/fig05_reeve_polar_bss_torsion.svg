  <g id="layer_labels">
  <text id="txt_3" x="44" y="46" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#F8FAFC">Fig 05 — Track B1: 3D Reeve Tetrahedra T_r Primal [1,1,r] vs Polar [1,r,r] BSS Torsion</text>
  <text id="txt_4" x="44" y="69" font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#CBD5E1">Track B (Trap 4 &amp; Theorem B1) | Cart(Sigma) ~= BSS_1(Sigma; Z), |T_r cap Z^3| = 4 vs Vol_3(T_r) = r (r = 2..12)</text>
  <text id="txt_6" x="40" y="871" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#334155">Certified Exact | Primal SNF(E_r) = [1,1,r] (Weil/Cart ~= Z/rZ) | Polar SNF(L_r) = [1,r,r] ((Z/rZ)^2 dual-apex torsion)</text>
  <text id="txt_10" x="40" y="122" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0F172A">A. 3D Reeve Tetrahedron T_r &amp; Polar Dual Normals</text>
  <text id="txt_12" x="583" y="120" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#2563EB">WEIL VS CARTIER</text>
  <text id="txt_25" x="315" y="173" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#DC2626">v_3 = (1, 1, r)  [Apex height r]</text>
  <text id="txt_26" x="154" y="502" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="end" fill="#0F172A">v_1=(1,0,0)</text>
  <text id="txt_27" x="456" y="502" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#0F172A">v_2=(0,1,0)</text>
  <text id="txt_28" x="290" y="522" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#1E3A8A">v_0=(0,0,0)  [Only 4 Z^3 points for ALL r &gt;= 1!]</text>
  <text id="txt_30" x="60" y="570" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#1E3A8A">Primal Edge Lattice vs Polar Primitive Facet-Form Spline Module</text>
  <text id="txt_31" x="60" y="590" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">Primal Edge Matrix: E_r = [[1,0,0], [0,1,0], [1,1,r]]</text>
  <text id="txt_32" x="60" y="620" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">  -&gt; SNF(E_r) = diag(1, 1, r)  =&gt;  Weil(Sigma_r) / Cart(Sigma_r) ~= Z/rZ</text>
  <text id="txt_33" x="60" y="650" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">  -&gt; Fractional wall jumps: (1/r, 1/r, 1/r) =&gt; Cartier DC hull = EMPTY!</text>
  <text id="txt_34" x="60" y="680" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">Polar Primitive Facet Forms: l_12 = z,  l_13 = -r*y + z,  l_23 = r*x - z</text>
  <text id="txt_35" x="60" y="710" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">  -&gt; L_r = [[0,0,1], [0,-r,1], [r,0,-1]]  =&gt;  SNF(L_r) = diag(1, r, r)!</text>
  <text id="txt_36" x="60" y="740" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">  -&gt; Dual-apex quotient Z^3 / L_r Z^3 ~= (Z/rZ)^2  (order r^2)</text>
  <text id="txt_37" x="60" y="770" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">  -&gt; All three 2x3 ridge colon ideals have SNF = diag(1, r).</text>
  <text id="txt_41" x="696" y="122" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0F172A">B. Reeve Family T_r (r=1..12): Torsion vs Lattice Pts</text>
  <text id="txt_43" x="1302" y="120" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#DC2626">ORDER r VS r^2</text>
