  <text id="txt_97" x="897" y="190" font-family="Menlo, Consolas, monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#DC2626">Polar |Z^3 / L_r Z^3| = r^2</text>
  <text id="txt_99" x="897" y="224" font-family="Menlo, Consolas, monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#1E3A8A">Primal |Weil / Cart| = Vol = r</text>
  <text id="txt_101" x="897" y="258" font-family="Menlo, Consolas, monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#059669">Lattice Points |T_r cap Z^3| = 4</text>
  <text id="txt_104" x="720" y="480" font-family="Menlo, Consolas, monospace" font-size="10" font-weight="bold" text-anchor="start" fill="#0F172A">r  | Vol_3 | |T_r n Z^3| | Primal SNF  | Polar SNF    | Ridge SNF | Weil/Cart</text>
  <text id="txt_106" x="720" y="525" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#0F172A"> 1 |   1   |      4      | [1, 1,  1] | [1,  1,  1] | [1,  1]   | 0 (Smooth)</text>
  <text id="txt_108" x="720" y="575" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#0F172A"> 2 |   2   |      4      | [1, 1,  2] | [1,  2,  2] | [1,  2]   | Z/2Z</text>
  <text id="txt_110" x="720" y="625" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#0F172A"> 3 |   3   |      4      | [1, 1,  3] | [1,  3,  3] | [1,  3]   | Z/3Z</text>
  <text id="txt_112" x="720" y="675" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#0F172A"> 5 |   5   |      4      | [1, 1,  5] | [1,  5,  5] | [1,  5]   | Z/5Z</text>
  <text id="txt_114" x="720" y="725" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#0F172A"> 8 |   8   |      4      | [1, 1,  8] | [1,  8,  8] | [1,  8]   | Z/8Z</text>
  <text id="txt_116" x="720" y="775" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#0F172A">12 |  12   |      4      | [1, 1, 12] | [1, 12, 12] | [1, 12]   | Z/12Z</text>
