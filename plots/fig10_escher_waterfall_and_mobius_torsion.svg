  <g id="layer_labels">
  <text id="txt_3" x="44" y="46" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#F8FAFC">Fig 10 — Track E: Outward Escher Waterfall, Pinned Contraction &amp; Mobius Z/2Z Torsion</text>
  <text id="txt_4" x="44" y="69" font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#CBD5E1">Track E (Counterexample E0 &amp; Theorems E1, E2) | Closed CPA Torsors vs Pinned Return Map &amp; Twisted Sheaf Z_{-1}</text>
  <text id="txt_6" x="40" y="871" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#334155">Certified Exact | E0: D^+ V_tilde &lt;= -19 yet P(r)=(21/19)^4 r &gt; r | E1: Factor 16/81 -&gt; r*=10/3 | E2: H^1(M_N;Z_{-1})=Z/2Z</text>
  <text id="txt_10" x="40" y="122" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0F172A">A. E0: Escher Waterfall</text>
  <text id="txt_12" x="403" y="120" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#DC2626">FALSIFIED</text>
  <text id="txt_29" x="242" y="490" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#DC2626">Start r_0 = 1 -&gt; 1-Lap r_1 = 194481/130321 &gt; 1!</text>
  <text id="txt_31" x="56" y="536" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#DC2626">Why Unpinned Closed Torsors Fail</text>
  <text id="txt_32" x="56" y="556" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">Annulus: {1 &lt;= ||x||_inf &lt;= 2} (8 cells)</text>
  <text id="txt_33" x="56" y="584" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">Flow:    f_k = R_{90}^k(1, 20) (outward!)</text>
  <text id="txt_34" x="56" y="612" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">Torsor:  [eta] = -16 != 0, d^1 eta = 0</text>
  <text id="txt_35" x="56" y="640" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">Every cell &amp; all 32 Filippov creases:</text>
  <text id="txt_36" x="56" y="668" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">  &lt;g, f&gt; in {-38, -21, -19} &lt;= -19 &lt; 0!</text>
  <text id="txt_37" x="56" y="696" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">Zero sliding modes (&lt;f_+- , n&gt; &gt; 0).</text>
  <text id="txt_38" x="56" y="724" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">Yet Poincare map EXPANDS outward:</text>
  <text id="txt_39" x="56" y="752" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">  P(r_0) = (21/19)^4 r_0 &gt; r_0!</text>
  <text id="txt_40" x="56" y="780" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">Angular drop -16 masks radial drift!</text>
  <text id="txt_44" x="492" y="122" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0F172A">B. E1: Pinned Contraction 16/81</text>
  <text id="txt_46" x="863" y="120" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#059669">CERTIFIED</text>
  <text id="txt_66" x="698" y="490" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#059669">Unique Rational Limit Cycle r* = 10/3</text>
  <text id="txt_68" x="508" y="536" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#059669">Pinned-Torsor &amp; Bouligand Certification</text>
  <text id="txt_69" x="508" y="556" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">Annulus: {2 &lt;= ||x||_inf &lt;= 6} (8 cells)</text>
  <text id="txt_70" x="508" y="584" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">Bouligand Invariance: &lt;f, n_out&gt; = -1 &lt; 0</text>
  <text id="txt_71" x="508" y="612" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">  (incl. 270-deg reflex inner corners!)</text>
  <text id="txt_72" x="508" y="640" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">Global CPA LP: INFEASIBLE (Farkas cycle)</text>
  <text id="txt_73" x="508" y="668" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">Flat Torsor [eta] = -96: D^+ V_tilde &lt;= -8</text>
  <text id="txt_74" x="508" y="696" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">Sector Refraction: r |-&gt; (2/3)r + 10/9</text>
  <text id="txt_75" x="508" y="724" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">1-Lap Pinned Contraction (Ghrist §6.2):</text>
  <text id="txt_76" x="508" y="752" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">  P(r) - 10/3 = (16/81) * (r - 10/3)!</text>
  <text id="txt_77" x="508" y="780" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">  r=2 -&gt; 238/81;   r=6 -&gt; 938/243.</text>
  <text id="txt_81" x="952" y="122" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0F172A">C. E2: Mobius Z_{-1} Torsion</text>
  <text id="txt_83" x="1312" y="120" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#7C3AED">H^1 ~= Z/2Z</text>
  <text id="txt_104" x="1156" y="178" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#7C3AED">Triangulated Mobius Band M_N (chi = 0)</text>
  <text id="txt_105" x="968" y="288" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="bold" text-anchor="end" fill="#7C3AED">+1</text>
  <text id="txt_106" x="1344" y="288" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="bold" text-anchor="start" fill="#7C3AED">-1</text>
  <text id="txt_107" x="1156" y="404" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#7C3AED">Antipodal Seam Twist: R_e = -1 in GL_1(Z)</text>
  <text id="txt_108" x="1156" y="426" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="middle" fill="#334155">Single Boundary Cycle (2N edges) for all N &gt;= 3</text>
  <text id="txt_110" x="968" y="478" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#7C3AED">Exact Z vs Q Twisted Cohomology Split</text>
  <text id="txt_111" x="968" y="498" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">Orientable Annulus: H^1(A; Z) ~= Z (free).</text>
  <text id="txt_112" x="968" y="523" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">Non-Orientable M_N carrying Z_{-1} (N=3..12):</text>
  <text id="txt_113" x="968" y="548" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">  * Exact Complex: delta^1 o delta^0 == 0</text>
  <text id="txt_114" x="968" y="573" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">  * Unimodular Coboundary SNF:</text>
  <text id="txt_115" x="968" y="598" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">      SNF(delta^0_{M_N}) = [1, ..., 1, 2]</text>
  <text id="txt_116" x="968" y="623" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">      (2N - 1 units and ONE factor of 2!)</text>
  <text id="txt_117" x="968" y="648" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">  * Integral Cohomology:</text>
  <text id="txt_118" x="968" y="673" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">      H^1(M_N; Z_{-1}) ~= Z / 2Z  (TORSION!)</text>
  <text id="txt_119" x="968" y="698" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">  * Rational Cohomology:</text>
  <text id="txt_120" x="968" y="723" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">      H^1(M_N; Q_{-1}) == 0       (TRIVIAL!)</text>
  <text id="txt_121" x="968" y="748" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">Odd loop cocycles trivialize over (1/2)Z,</text>
  <text id="txt_122" x="968" y="773" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">never over Z!</text>
  </g>
</svg>
