  <g id="layer_labels">
  <text id="txt_3" x="44" y="46" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#F8FAFC">Fig 04 — Track B2: 5-Ray Fan Sigma_5^(k) Genuine Simultaneous Chvatal Rank = 2k + 1</text>
  <text id="txt_4" x="44" y="69" font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#CBD5E1">Track B (Theorem B2) | Escaping Planar 2-Cone Collapse via dim B_Sigma = 3 in R^3 (Ranks 3, 5, 7, 9)</text>
  <text id="txt_6" x="40" y="871" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#334155">Certified Exact | Rays (1,0), (2k+1,1), (-(2k+1),1), (-1,-2), (0,-1) | Pure Cartier w(f) = (0, 1, 0, 1, -(2k+1))</text>
  <text id="txt_10" x="40" y="122" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0F172A">A. 5-Ray Complete Fan Sigma_5^(k) (dim B = 3)</text>
  <text id="txt_12" x="565" y="120" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#7C3AED">ESCAPES 2D CEILING</text>
  <text id="txt_28" x="538" y="345" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#2563EB">v_1=(1,0) [w=0]</text>
  <text id="txt_29" x="514" y="264" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#7C3AED">v_2=(2k+1,1) [w=1]</text>
  <text id="txt_30" x="162" y="264" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#7C3AED">v_3=(-(2k+1),1) [w=0]</text>
  <text id="txt_31" x="238" y="534" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="end" fill="#0F766E">v_4=(-1,-2) [w=1]</text>
  <text id="txt_32" x="352" y="534" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#DC2626">v_5=(0,-1) [w=-(2k+1)]</text>
  <text id="txt_34" x="60" y="590" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#7C3AED">Structural Mechanism of Unbounded Rank inside Cart(Sigma)</text>
  <text id="txt_35" x="60" y="610" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#334155">1. With m = 5 primitive rays in R^2, balanced wall space has</text>
  <text id="txt_36" x="60" y="641" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#334155">   dimension dim B_{Sigma_5^(k)} = 5 - 2 = 3 (3D polyhedral cone!).</text>
  <text id="txt_37" x="60" y="672" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#334155">2. Pure integer-gradient Cartier target w^prim(f) = (0, 1, 0, 1, -(2k+1))</text>
  <text id="txt_38" x="60" y="703" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#334155">   induces a narrow 3-facet spike with initial vertex denominator 4k + 3.</text>
  <text id="txt_39" x="60" y="734" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#334155">3. Each simultaneous elementary Chvatal closure P -&gt; P^(1) shaves</text>
  <text id="txt_40" x="60" y="765" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#334155">   spike height by exactly 1 unit, forcing EXACT rank = 2k + 1!</text>
  <text id="txt_44" x="688" y="122" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0F172A">B. Simultaneous Elementary Chvatal Rank = 2k + 1</text>
  <text id="txt_46" x="1295" y="120" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#059669">EXACT 3, 5, 7, 9</text>
  <text id="txt_49" x="756" y="162" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#334155">Sim. CG Rank</text>
  <text id="txt_51" x="732" y="412" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="end" fill="#334155">1</text>
  <text id="txt_53" x="732" y="360" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="end" fill="#334155">3</text>
  <text id="txt_55" x="732" y="308" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="end" fill="#334155">5</text>
  <text id="txt_57" x="732" y="256" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="end" fill="#334155">7</text>
  <text id="txt_59" x="732" y="204" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="end" fill="#334155">9</text>
  <text id="txt_62" x="896" y="200" font-family="Menlo, Consolas, monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#D97706">4-Ray Ceiling: Sim. Rank = 1</text>
  <text id="txt_64" x="825" y="332" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#2563EB">Rank = 3</text>
  <text id="txt_65" x="825" y="347" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="middle" fill="#334155">den=7</text>
  <text id="txt_66" x="825" y="454" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#0F172A">k=1 (m=3)</text>
  <text id="txt_67" x="825" y="472" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="middle" fill="#64748B">apex (3,4,3)</text>
  <text id="txt_69" x="961" y="280" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F766E">Rank = 5</text>
  <text id="txt_70" x="961" y="295" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="middle" fill="#334155">den=11</text>
  <text id="txt_71" x="961" y="454" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#0F172A">k=2 (m=5)</text>
  <text id="txt_72" x="961" y="472" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="middle" fill="#64748B">apex (5,6,5)</text>
  <text id="txt_74" x="1097" y="228" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#7C3AED">Rank = 7</text>
  <text id="txt_75" x="1097" y="243" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="middle" fill="#334155">den=15</text>
  <text id="txt_76" x="1097" y="454" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#0F172A">k=3 (m=7)</text>
  <text id="txt_77" x="1097" y="472" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="middle" fill="#64748B">apex (7,8,7)</text>
  <text id="txt_79" x="1233" y="176" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#DC2626">Rank = 9</text>
  <text id="txt_80" x="1233" y="191" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="middle" fill="#334155">den=19</text>
  <text id="txt_81" x="1233" y="454" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#0F172A">k=4 (m=9)</text>
  <text id="txt_82" x="1233" y="472" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="middle" fill="#64748B">apex (9,10,9)</text>
  <text id="txt_84" x="710" y="518" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#059669">Certified Exact 3D Hilbert-Parallelepiped Closure Summary</text>
  <text id="txt_85" x="710" y="538" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">k=1 (m=3): P^(0) max_den=7  -&gt; P^(1) -&gt; P^(2) -&gt; P^(3) INT {(1,1,0),(2,1,1),(3,4,3)}</text>
  <text id="txt_86" x="710" y="572" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">k=2 (m=5): P^(0) max_den=11 -&gt; ... (5 exact rounds) ... -&gt; P^(5) INT {(1,1,0),(2,1,1),(5,6,5)}</text>
  <text id="txt_87" x="710" y="606" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">k=3 (m=7): P^(0) max_den=15 -&gt; ... (7 exact rounds) ... -&gt; P^(7) INT {(1,1,0),(2,1,1),(7,8,7)}</text>
  <text id="txt_88" x="710" y="640" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">k=4 (m=9): P^(0) max_den=19 -&gt; ... (9 exact rounds) ... -&gt; P^(9) INT {(1,1,0),(2,1,1),(9,10,9)}</text>
  <text id="txt_89" x="710" y="674" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155"></text>
  <text id="txt_90" x="710" y="708" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">General Law: rank_CG^sim(D_tilde_{Sigma_5^(k)}(w(f))) = 2k + 1 -&gt; +infinity as k -&gt; +inf,</text>
  <text id="txt_91" x="710" y="742" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">proving arbitrarily high simultaneous Chvatal-Gomory rank even on pure Cartier functions!</text>
