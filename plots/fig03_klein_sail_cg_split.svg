  <g id="layer_labels">
  <text id="txt_3" x="44" y="46" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#F8FAFC">Fig 03 — Track B2: 4-Ray Sigma_*^(k) Fractional Vertex (6/5, 2/5), Klein Sail &amp; CG Split</text>
  <text id="txt_4" x="44" y="69" font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#CBD5E1">Track B (Theorem B2) | Sequential Axis Gomory Rank = 2..3 vs Simultaneous Schrijver-Chvatal Rank = 1</text>
  <text id="txt_6" x="40" y="871" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#334155">Certified Exact | w^(1)(u,t) = (-u+3t, u, 2t, 2u-t) &gt;= (0,1,0,2) | LP Opt (6/5, 2/5) | Klein Sail {(2,1),(2,2),(3,1)}</text>
  <text id="txt_10" x="40" y="122" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0F172A">A. Exact (u, t) Cone &amp; Klein Sail Hull on Sigma_*^(1)</text>
  <text id="txt_12" x="614" y="120" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#1E3A8A">LP VERTEX (6/5, 2/5)</text>
  <text id="txt_19" x="656" y="715" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" text-anchor="start" fill="#0F172A">u</text>
  <text id="txt_20" x="104" y="162" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" text-anchor="end" fill="#0F172A">t</text>
  <text id="txt_22" x="110" y="734" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#334155">0</text>
  <text id="txt_24" x="240" y="734" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#334155">1</text>
  <text id="txt_26" x="370" y="734" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#334155">2</text>
  <text id="txt_28" x="500" y="734" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#334155">3</text>
  <text id="txt_30" x="630" y="734" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#334155">4</text>
  <text id="txt_32" x="96" y="714" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="end" fill="#334155">0</text>
  <text id="txt_34" x="96" y="544" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="end" fill="#334155">1</text>
  <text id="txt_36" x="96" y="374" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="end" fill="#334155">2</text>
  <text id="txt_38" x="96" y="204" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="end" fill="#334155">3</text>
  <text id="txt_61" x="239" y="671" font-family="Menlo, Consolas, monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#DC2626">LP Opt (6/5, 2/5), ||w+||=4</text>
  <text id="txt_63" x="211" y="513" font-family="Menlo, Consolas, monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#D97706">Seq R1: (3/2, 1)</text>
  <text id="txt_65" x="532" y="357" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#059669">Klein Sail P_I</text>
  <text id="txt_66" x="388" y="522" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#059669">(2,1) Opt=6</text>
  <text id="txt_67" x="514" y="566" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#059669">(3,1)</text>
  <text id="txt_68" x="386" y="366" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#059669">(2,2)</text>
  <text id="txt_69" x="136" y="232" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#2563EB">Cut u &gt;= 2</text>
  <text id="txt_70" x="366" y="776" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1E3A8A">Simultaneous Round 1 applies BOTH lambda^(1)=(2/5,0,0,1/5) =&gt; t&gt;=1</text>
  <text id="txt_71" x="366" y="798" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#059669">AND lambda^(2)=(1/5,0,0,3/5) =&gt; u&gt;=2 in P_0^(1) -&gt; Sim. CG Rank = 1!</text>
  <text id="txt_75" x="744" y="122" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0F172A">B. CG Definition Split Across Sigma_*^(k) (k=1..10)</text>
  <text id="txt_77" x="1292" y="120" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#D97706">SIM=1 VS SEQ=2..3</text>
  <text id="txt_79" x="762" y="174" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#1E3A8A">Why Simultaneous Schrijver-Chvatal = 1 While Sequential Gomory = 2..3</text>
  <text id="txt_80" x="762" y="194" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">1. Jensen's inequality makes w_2 &gt;= 1 and w_3 &gt;= 0 redundant on P_0,</text>
  <text id="txt_81" x="762" y="214" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">   collapsing P_0 to a planar 2-facet cone of determinant D = 2k + 3.</text>
  <text id="txt_82" x="762" y="234" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">2. Every Hilbert-basis generator of the active 2-cone belongs to P_0^(1) -&gt; Rank 1!</text>
  <text id="txt_83" x="762" y="254" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">3. Sequential axis cuts (t &gt;= 1, then u &gt;= k+1) leave residual fractional</text>
  <text id="txt_84" x="762" y="274" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">   vertex (k+1, 2k/(2k-1)) for ALL k &gt;= 2, requiring a 3rd oblique cut!</text>
  <text id="txt_87" x="762" y="330" font-family="Menlo, Consolas, monospace" font-size="10" font-weight="bold" text-anchor="start" fill="#0F172A">k  | Det | LP Opt (u*, t*) | After u&gt;=k+1   | Seq | Sim | Klein Sail</text>
  <text id="txt_89" x="764" y="378" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#0F172A"> 1 |   5 | (6/5, 2/5)      | (2,1) INT!     |  2  |  1  | (2,1),(2,2),(3,1)</text>
  <text id="txt_91" x="764" y="434" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#0F172A"> 2 |   7 | (10/7, 2/7)     | (3, 4/3) FRAC  |  3  |  1  | (3,1),(4,2),(5,1)</text>
