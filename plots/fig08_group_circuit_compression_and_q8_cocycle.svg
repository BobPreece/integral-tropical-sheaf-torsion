  <g id="layer_labels">
  <text id="txt_3" x="44" y="46" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#F8FAFC">Fig 08 — Track D1/D4: Permutation Compression &amp; Q_8 / Dic_3 2-Cocycle Staircase</text>
  <text id="txt_4" x="44" y="69" font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#CBD5E1">Track D (Theorems D1, D4a, D4b) | Q_8: 64 -&gt; 48 -&gt; 43/38 -&gt; 22(Q, den=8) -&gt; 17/18(Z)! &amp; Dic_3: 144 -&gt; 49 -&gt; 25/26(Z)!</text>
  <text id="txt_6" x="40" y="871" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#334155">Certified Exact | C_5: W=8 &lt;&lt; 25 | V_4: Walsh [2]-torsion vs W_Z=6/7 surgery | Q_8 &amp; D_4 parity invariance W_Z=17/18</text>
  <text id="txt_10" x="40" y="122" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0F172A">A. Compression: |G|^2 vs Perm m^2 vs Wave II Z</text>
  <text id="txt_12" x="604" y="120" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#1E3A8A">SHATTERS Q_8 WALL</text>
  <text id="txt_14" x="58" y="180" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#0F172A">C_5   | |G|^2= 25 | Perm m^2=25 (blocked) </text>
  <text id="txt_15" x="58" y="204" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#059669">Wave II Pure-Z Indicator: W =  8  [Ramp 2n-2 = 8/9 (3.1x)]</text>
  <text id="txt_19" x="58" y="258" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#0F172A">V_4   | |G|^2= 16 | Perm m^2=16 (blocked) </text>
  <text id="txt_20" x="58" y="282" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#059669">Wave II Pure-Z Indicator: W =  6  [Walsh [2] vs Z-Surg W=6/7]</text>
  <text id="txt_24" x="58" y="336" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#0F172A">S_3   | |G|^2= 36 | Perm m^2=9 (argmax)   </text>
  <text id="txt_25" x="58" y="360" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#059669">Wave II Pure-Z Indicator: W = 13  [Perm 9 / Ind Z W=13/14]</text>
  <text id="txt_29" x="58" y="414" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#0F172A">D_4   | |G|^2= 64 | Perm m^2=16 (argmax)  </text>
  <text id="txt_30" x="58" y="438" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#059669">Wave II Pure-Z Indicator: W = 17  [Perm 16 / Ind Z W=17/18]</text>
  <text id="txt_34" x="58" y="492" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#0F172A">Q_8   | |G|^2= 64 | Perm m^2=64 (WALL!)   </text>
  <text id="txt_35" x="58" y="516" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#7C3AED">Wave II Pure-Z Indicator: W = 17  [64-&gt;48-&gt;43-&gt;22(Q)-&gt;17/18(Z)!]</text>
  <text id="txt_39" x="58" y="570" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#0F172A">Dic_3 | |G|^2=144 | Perm m^2=49 (intrans) </text>
  <text id="txt_40" x="58" y="594" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#7C3AED">Wave II Pure-Z Indicator: W = 25  [144-&gt;49-&gt;25/26(Z) (5.8x!)]</text>
  <text id="txt_44" x="58" y="648" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#0F172A">Q_16  | |G|^2=256 | Perm m^2=256 (WALL!)  </text>
  <text id="txt_45" x="58" y="672" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#7C3AED">Wave II Pure-Z Indicator: W = 33  [Cocycle Ramp Z W=33/34!]</text>
  <text id="txt_49" x="58" y="730" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#D97706">Universal Lower Bounds (Theorem D4b)</text>
  <text id="txt_50" x="58" y="750" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">1. Rank Bound: det(I_mult^T I_mult) = |G|^{|G|} =&gt; W &gt;= |G|-1 (biased), |G| (zero-bias).</text>
  <text id="txt_51" x="58" y="771" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">2. 1-Neuron Outcome Lemma: ZERO single ReLU neurons lie in V_out =&gt; W &gt;= |G| (biased)!</text>
  <text id="txt_52" x="58" y="792" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">3. Ray-Bucket Rank-Nullity: W = |G| refuted across entire pool =&gt; C_3 minimal W_Z = 4.</text>
  <text id="txt_56" x="724" y="122" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0F172A">B. Q_8 2-Cocycle Architecture (64 -&gt; 17 Over Z)</text>
  <text id="txt_58" x="1285" y="120" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#7C3AED">W_Z = 2|G| + 1 = 17</text>
  <text id="txt_60" x="782" y="178" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#DC2626">Perm Wall</text>
  <text id="txt_61" x="782" y="202" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#0F172A">W = 64</text>
  <text id="txt_65" x="911" y="178" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#D97706">H^2 Fiber</text>
  <text id="txt_66" x="911" y="202" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#0F172A">W_Z = 48</text>
  <text id="txt_70" x="1040" y="178" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#334155">Quot-Red Z</text>
  <text id="txt_71" x="1040" y="202" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#0F172A">W_Z=43/38</text>
  <text id="txt_75" x="1169" y="178" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#2563EB">Walsh+HL Q</text>
  <text id="txt_76" x="1169" y="202" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#0F172A">W_Q = 22</text>
  <text id="txt_80" x="1298" y="178" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#059669">Superposed</text>
  <text id="txt_81" x="1298" y="202" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#0F172A">W_Z=17/18</text>
  <text id="txt_83" x="1042" y="260" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#1E3A8A">Superposed 2-Cocycle Regime Map on 1 -&gt; C_4 = &lt;i&gt; -&gt; Q_8 -&gt; C_2 -&gt; 1 (x^2 = i^2 = -1)</text>
  <text id="txt_85" x="760" y="302" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#059669">Block A x A  (i^r1 * i^r2)</text>
  <text id="txt_86" x="760" y="330" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#0F172A">S_1 = r1 + r2 in [0, 6]</text>
  <text id="txt_87" x="760" y="356" font-family="Menlo, Consolas, monospace" font-size="10" font-weight="bold" text-anchor="start" fill="#059669">ACTIVE KINKS: Delta^2 = 1[S_1=t]</text>
  <text id="txt_89" x="1062" y="302" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#2563EB">Block A x Aj  (i^r1 * i^r2 j)</text>
  <text id="txt_90" x="1062" y="330" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#0F172A">S_1 = +2K + ... &gt;= 20</text>
  <text id="txt_91" x="1062" y="356" font-family="Menlo, Consolas, monospace" font-size="10" font-weight="bold" text-anchor="start" fill="#2563EB">PURELY AFFINE: Delta^2 == 0!</text>
  <text id="txt_93" x="760" y="420" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#334155">Block Aj x A  (i^r1 j * i^r2)</text>
  <text id="txt_94" x="760" y="448" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#0F172A">S_1 = -2K + ... &lt;= -14</text>
  <text id="txt_95" x="760" y="474" font-family="Menlo, Consolas, monospace" font-size="10" font-weight="bold" text-anchor="start" fill="#334155">CLIPPED OFF: ReLU == 0!</text>
  <text id="txt_97" x="1062" y="420" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" text-anchor="start" fill="#7C3AED">Block Aj x Aj  (x^2 = a^2 cocycle!)</text>
  <text id="txt_98" x="1062" y="448" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#0F172A">S_1 = (r1+3 mod 4)+(3-r2)</text>
  <text id="txt_99" x="1062" y="474" font-family="Menlo, Consolas, monospace" font-size="10" font-weight="bold" text-anchor="start" fill="#7C3AED">ACTIVE KINKS: exact cocycle shift!</text>
  <text id="txt_101" x="742" y="562" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#7C3AED">Cohomological Parity Invariance, Howell-Lafon W_Q=22 &amp; V_4 Surgery</text>
  <text id="txt_102" x="742" y="582" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">1. Shifted/Superposed Pure-Z Law (1 -&gt; C_m -&gt; G -&gt; C_2 -&gt; 1, |G| = 2m):</text>
  <text id="txt_103" x="742" y="614" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">     W_Z^biased = 4m + 1 = 2|G| + 1  (Q_8 &amp; D_4: 17/18; Dic_3: 25/26 &lt;&lt; 49 &lt;&lt; 144)!</text>
  <text id="txt_104" x="742" y="646" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">2. Walsh + Howell-Lafon Quaternion Bilinear Rank 8 on Q_8:</text>
  <text id="txt_105" x="742" y="678" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">     W_Q = 22 dyadic indicator (den = 8) &amp; W_Z = 22 pure-Z strict argmax!</text>
  <text id="txt_106" x="742" y="710" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">3. V_4 Z-vs-Q Separation &amp; Torsion-Killing Surgery:</text>
  <text id="txt_107" x="742" y="742" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">     Sym. Walsh W=6 has SNF=[1^6, 2] (Q-SAT den=2, Z-UNSAT), cured to SNF=[1^7]</text>
  <text id="txt_108" x="742" y="774" font-family="Menlo, Consolas, monospace" font-size="10" text-anchor="start" fill="#334155">     at W_Z = 6 (biased) / 7 (zero-bias) by 1 hinge ReLU([0,-1,-1,-1]+[1,2,2,2])!</text>
  </g>
</svg>
